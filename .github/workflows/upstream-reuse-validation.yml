name: Upstream reuse proposal validation
on:
  push:
    branches: [ci/h2-keepalive-upstream-review]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: jiahaoliang/hyper
          ref: 91fe2a92b0f828256fffdfe6bf23283ab7a6bc23
          path: hyper
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: jiahaoliang/hyper-util
          ref: f57212520b40fcd58c37993d632c10eed37b2f72
          path: hyper-util
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Hyper tests and feature checks
        working-directory: hyper
        run: |
          cargo test --features full --lib
          cargo check --no-default-features --features client,http2
          cargo check --no-default-features --features server,http2
          cargo check --no-default-features --features client,http1
          cargo doc --no-deps --features full
      - name: Companion hyper-util tests and feature checks
        working-directory: hyper-util
        run: |
          cargo --config "patch.crates-io.hyper.path='$GITHUB_WORKSPACE/hyper'" test --features full --test keepalive_reuse
          cargo --config "patch.crates-io.hyper.path='$GITHUB_WORKSPACE/hyper'" test --features full --lib
          cargo --config "patch.crates-io.hyper.path='$GITHUB_WORKSPACE/hyper'" test --features full --test legacy_client
          cargo --config "patch.crates-io.hyper.path='$GITHUB_WORKSPACE/hyper'" check --no-default-features --features client-legacy,http2
          cargo --config "patch.crates-io.hyper.path='$GITHUB_WORKSPACE/hyper'" check --no-default-features --features client-legacy,http1
          cargo --config "patch.crates-io.hyper.path='$GITHUB_WORKSPACE/hyper'" doc --no-deps --features full
          cargo --config "patch.crates-io.hyper.path='$GITHUB_WORKSPACE/hyper'" tree -i h2 --features full
      - name: Hyper formatting
        if: always()
        working-directory: hyper
        run: |
          rustfmt --edition 2021 src/client/conn/http2.rs src/proto/h2/client.rs src/proto/h2/ping.rs src/proto/h2/server.rs
          git diff --exit-code
      - name: hyper-util formatting
        if: always()
        working-directory: hyper-util
        run: |
          cargo fmt --all
          git diff --exit-code
